<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#101512"><title>Shot Flow Data</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="manage.css"></head><body><header class="app-header"><a class="back-link" href="shot_flow.html">Shot Flow</a><span id="storage-status" class="connection" aria-live="polite">Loading</span></header><main><section class="manager-header"><div><p class="eyebrow">Local data</p><h1>Shots & profiles</h1></div></section><nav class="manager-tabs" aria-label="Data views"><button class="manager-tab selected" type="button" data-view="shots">Shots <span id="shot-count">0</span></button><button class="manager-tab" type="button" data-view="profiles">Profiles <span id="profile-count">0</span></button><button class="manager-tab" type="button" data-view="settings">Settings</button></nav><section id="shots-view" class="manager-view" aria-labelledby="shots-heading"><div class="section-heading"><div><h2 id="shots-heading">Saved shots</h2><p>Actual measured flow and yield samples.</p></div></div><div id="shot-list" class="data-list"></div><p id="shot-empty" class="empty-state">No saved shots yet.</p></section><section id="profiles-view" class="manager-view" aria-labelledby="profiles-heading" hidden><div class="section-heading"><div><h2 id="profiles-heading">Target profiles</h2><p>Profiles created from saved shots.</p></div></div><div id="profile-list" class="data-list"></div><p id="profile-empty" class="empty-state">No custom profiles yet.</p></section><section id="settings-view" class="manager-view" aria-labelledby="settings-heading" hidden><div class="section-heading"><div><h2 id="settings-heading">Defaults</h2><p>Applied when Shot Flow opens.</p></div></div><form id="settings-form" class="settings-form"><label><span>Default dose</span><span class="settings-input"><input id="default-dose" type="number" min="5" max="40" step="0.1" value="18.0" required><i>g</i></span></label><label><span>Default target</span><select id="default-profile"><option value="none">No target</option><option value="espresso">Espresso</option><option value="turbo">Turbo</option></select></label><label class="setting-toggle"><span>Auto detect shots</span><input id="default-auto" type="checkbox" checked></label><label class="setting-toggle"><span>Grind guidance</span><input id="default-guidance" type="checkbox"></label><button class="button primary" type="submit">Save settings</button></form></section></main><script type="module" src="manage.js"></script></body></html>
