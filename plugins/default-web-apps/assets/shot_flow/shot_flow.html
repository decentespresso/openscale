<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#101512"><title>Shot Flow</title><link rel="stylesheet" href="styles.css"></head><body><header class="app-header"><a class="back-link" href="../index.html">Half Decent Scale</a><div class="connection" aria-live="polite"><span id="connection-dot" class="connection-dot"></span><span id="connection-status">Connecting</span></div></header><main><section class="shot-header" aria-labelledby="page-title"><div><p class="eyebrow">Live extraction</p><h1 id="page-title">Shot Flow</h1></div><div class="shot-state"><span id="state-label">Ready</span><span id="state-detail">Waiting for flow</span></div></section><section class="metrics" aria-label="Shot measurements"><div class="metric metric-primary"><span class="metric-label">Yield</span><strong><span id="yield-value">0.0</span><small>g</small></strong><span id="yield-target" class="metric-note">of 36.0g</span></div><div class="metric"><span class="metric-label">Time</span><strong><span id="time-value">0.0</span><small>s</small></strong><span id="time-target" class="metric-note">of 25s</span></div><div class="metric"><span class="metric-label">Flow</span><strong><span id="flow-value">0.0</span><small>g/s</small></strong><span id="flow-target" class="metric-note">target 0.0g/s</span></div></section><section class="chart-section" aria-label="Extraction graph"><div class="chart-heading"><div class="legend" aria-label="Graph legend"><span><i class="legend-line actual-flow"></i>Flow</span><span class="target-legend"><i class="legend-line target-flow"></i>Ghost flow</span><span><i class="legend-line actual-weight"></i>Yield</span><span class="target-legend"><i class="legend-line target-weight"></i>Ghost yield</span></div><span id="pace-label" class="pace-label">On target</span></div><div class="chart-frame"><canvas id="shot-chart" aria-label="Live flow rate and yield over time"></canvas></div></section><section id="grind-recommendation" class="recommendation" aria-live="polite" hidden><span class="control-label">Grind recommendation</span><strong id="recommendation-title">Keep this grind</strong><span id="recommendation-detail"></span></section><section class="control-strip" aria-label="Shot controls"><div class="control-group preset-control"><span class="control-label">Profile</span><div class="profile-row"><select id="profile-select" aria-label="Target profile"><option value="none">No target</option><option value="espresso" selected>Espresso &middot; 1:2 &middot; 25s</option><option value="turbo">Turbo &middot; 1:4 &middot; 30s</option></select><button id="save-shot-button" class="button secondary compact" type="button" disabled>Save shot</button><a class="button secondary compact manage-link" href="manage.html">Manage</a></div></div><label class="control-group dose-control"><span class="control-label">Coffee dose</span><span class="number-field"><input id="dose-input" type="number" min="5" max="40" step="0.1" value="18.0" inputmode="decimal"><span>g</span></span></label><div class="toggle-stack"><label class="auto-control"><input id="auto-toggle" type="checkbox" checked><span class="toggle-track" aria-hidden="true"><span></span></span><span>Auto detect</span></label><label class="auto-control"><input id="grind-toggle" type="checkbox"><span class="toggle-track" aria-hidden="true"><span></span></span><span>Grind guidance</span></label></div><div class="actions"><button id="tare-button" class="button secondary" type="button">Tare</button><button id="reset-button" class="button secondary" type="button">Reset</button><button id="shot-button" class="button primary" type="button">Start shot</button></div></section></main><dialog id="save-shot-dialog"><form id="save-shot-form" method="dialog"><span class="control-label">Shot history</span><h2>Save this shot</h2><label><span>Shot name</span><input id="shot-name-input" type="text" maxlength="40" required autocomplete="off"></label><p id="save-shot-summary" class="dialog-summary"></p><div class="dialog-actions"><button id="cancel-shot-button" class="button secondary" type="button">Cancel</button><button class="button primary" type="submit">Save shot</button></div></form></dialog><script src="../shared/reconnecting-websocket.js"></script><script type="module" src="main.js"></script></body></html>
