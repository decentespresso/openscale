
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
workspace_dir = .pio.nosync
default_envs = esp32s3
data_dir = web_apps

[env:esp32s3]
;-- esp32
; Pin the pioarduino platform to an explicit version (= arduino-esp32 3.3.11)
; instead of the rolling `stable` tag. This release includes esp-mDNS 1.11.3,
; whose service browser stages PTR and A/AAAA records regardless of packet order.
; Bump this URL deliberately to adopt a newer framework.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
# Advisory pre-build check: warns (build log + CI annotation) when the pinned
# platform above is behind the latest pioarduino stable release, so a deliberate
# pin doesn't silently rot. Never fails the build; skip with HDS_SKIP_PLATFORM_CHECK=1.
extra_scripts =
  pre:check_platform_freshness.py
  pre:ota_public_key_header.py
  post:gzip_web_assets.py
# Partition table: vendored copy of the upstream arduino-esp32 default_8MB.csv.
# The board (esp32-s3-devkitc-1, 8 MB flash) already defaults to this layout,
# so this line is currently a no-op. It makes the implicit default explicit so
# a future platform upgrade cannot silently change the partition layout on us.
#
# HDS 1.x ships with 16 MB flash; HDS 2.0 will use 8 MB. The firmware already
# fits in 8 MB, so pinning 8 MB now means the HDS 2.0 transition needs no
# partition-table change (which would require a full erase + re-flash).
# Trade-off: wastes the upper 8 MB on current HDS 1.x hardware.
#
# The vendored copy is kept in partitions/default_8MB.csv.
board_build.partitions = partitions/default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
build_flags =
;  -DESP32
  -I.pio.nosync/generated/include
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
  ; Cap each WS client's outbound queue (lib default 32) so a backed-up or
  ; half-open client (connection churn) can't hoard heap. Bounds aggregate heap
  ; growth; complements the WS_BROADCAST_HEAP_FLOOR gate in include/websocket.h.
  -D WS_MAX_QUEUED_MESSAGES=8
  !python3 git_rev_macro.py

#	-D DEBUG
#
;lib_ldf_mode = deep+
#
lib_compat_mode = strict
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  bxparks/AceButton @ 1.10.1
  https://github.com/decentespresso/ADS1232_ADC.git#24cd10d3037c878f751a057377303598a00f977e
  robtillaart/StopWatch @ 0.3.6
  adafruit/Adafruit ADS1X15 @ 2.6.2
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit MPU6050 @ 2.2.9
  adafruit/Adafruit SSD1306 @ 2.5.17
  adafruit/Adafruit Unified Sensor @ 1.1.15
  esp32async/AsyncTCP @ 3.5.0
  esp32async/ESPAsyncWebServer @ 3.11.2
  ayushsharma82/ElegantOTA @ 3.1.7
  sparkfun/SparkFun BMA400 Arduino Library @ 1.0.0
  olikraus/U8g2 @ 2.36.18

lib_ignore =
  Adafruit GFX Library
  Adafruit SSD1306

monitor_filters =
  esp32_exception_decoder
  send_on_enter

[env:esp32s3-grinder]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DHDS_ENABLE_GRINDER=1

[env:esp32s3-pressensor]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DHDS_ENABLE_PRESSENSOR=1

[env:native]
platform = native
test_build_src = no
test_framework = unity
build_flags = -Iinclude
