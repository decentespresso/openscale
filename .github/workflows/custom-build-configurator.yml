name: Custom build configurator

on:
  pull_request:
    paths:
      - ".github/workflows/custom-build-configurator.yml"
      - "docs/custom-build/**"
      - "plugins/**"
      - "requirements-custom-build.txt"
      - "tools/configure_custom_build.py"
      - "tools/plugin_presentation.py"
      - "tools/test_plugin_catalog.py"
      - "tools/test_webapp_contract.py"
      - "!docs/custom-build/catalog.json"
      - "!docs/custom-build/service-catalog.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create prospective release tag
        run: |
          if ! git show-ref --verify --quiet refs/tags/v3.1.14; then
            git tag v3.1.14 "${{ github.sha }}"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install catalog dependencies
        run: python -m pip install --requirement requirements-custom-build.txt
      - name: Validate configurator contracts
        run: |
          python tools/test_plugin_catalog.py
          python tools/test_webapp_contract.py
          python tools/test_custom_build_execution.py
          node --check docs/custom-build/app.js
          node --check docs/custom-build/fleet.js
          node --test cloudflare/custom-build-worker/test/configurator.test.mjs
          node --test cloudflare/custom-build-worker/test/fleet-polling.test.mjs
