name: Custom firmware build

on:
  pull_request:
    paths:
      - ".github/workflows/custom-build.yml"
      - "*.py"
      - "custom-build.json"
      - "docs/custom-build/**"
      - "include/**"
      - "keys/**"
      - "partitions/**"
      - "platformio.ini"
      - "plugins/**"
      - "requirements-platformio.txt"
      - "src/**"
      - "cloudflare/custom-build-worker/**"
      - "tools/**"
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: Firmware ref
        required: true
        default: main
      features:
        description: Comma-separated feature IDs
        required: false
        default: pull-ota
      plugins:
        description: Comma-separated plugin IDs
        required: false
        default: default-web-apps
      builder_ref:
        description: Trusted builder ref supplied by the build service
        required: false
        default: ""
      builder_commit:
        description: Exact builder commit supplied by the build service
        required: false
        default: ""
      source_commit:
        description: Exact source commit supplied by the build service
        required: false
        default: ""
      combination_hash:
        description: Expected combination hash supplied by the build service
        required: false
        default: ""
      attempt_id:
        description: Fenced build attempt supplied by the build service
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: custom-build-${{ github.event_name == 'workflow_dispatch' && inputs.combination_hash || github.run_id }}
  cancel-in-progress: false

jobs:
  detect_plugins:
    if: github.event_name == 'pull_request'
    name: detect changed plugins
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plugins.outputs.count }}
      matrix: ${{ steps.plugins.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate custom build contracts
        run: |
          python tools/test_plugin_catalog.py
          python tools/test_custom_build_execution.py
          python tools/test_custom_cache_transport.py
          python tools/test_plugin_ci_contract.py
          node --test cloudflare/custom-build-worker/test/configurator.test.mjs
          node --test cloudflare/custom-build-worker/test/worker.test.mjs
          node --test cloudflare/custom-build-worker/test/fleet.test.mjs
          node --check docs/custom-build/fleet.js
      - name: Detect changed patch plugins
        id: plugins
        run: >-
          python tools/list_changed_patch_plugins.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --github-output "$GITHUB_OUTPUT"

  verify_plugins:
    if: needs.detect_plugins.outputs.count != '0'
    needs: detect_plugins
    name: plugin (${{ matrix.plugin }}, ${{ matrix.firmware_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect_plugins.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-platformio.txt') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: python -m pip install --requirement requirements-platformio.txt
      - name: Configure plugin selection
        env:
          FIRMWARE_REF: ${{ matrix.firmware_ref }}
          PLUGIN_ID: ${{ matrix.plugin }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import configure_custom_build as customBuild
          path = Path(".pio.nosync/plugin-ci.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          selection = customBuild.recommendedPluginSelection(
              customBuild.loadPluginCatalog(),
              os.environ["PLUGIN_ID"],
              os.environ["FIRMWARE_REF"],
          )
          path.write_text(json.dumps(selection) + "\n", encoding="utf-8")
          PY
      - name: Build plugin environment
        env:
          PLUGIN_ID: ${{ matrix.plugin }}
        run: >-
          python tools/build_custom_firmware.py
          --config .pio.nosync/plugin-ci.json
          --verify-plugin-environment "esp32s3-$PLUGIN_ID"

  compile_custom:
    if: github.event_name == 'pull_request'
    name: custom firmware (minimal)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-platformio.txt') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: python -m pip install --requirement requirements-platformio.txt
      - name: Configure minimal selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(".pio.nosync/pr-ci.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "firmware_ref": "main",
              "features": [],
              "plugins": [],
          }) + "\n", encoding="utf-8")
          PY
      - name: Create test custom OTA key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/custom-ota.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/custom-ota.pem" -pubout \
            -out keys/ota/hds_custom_ota_manifest_public_key_1.pem
          {
            echo 'HDS_CUSTOM_OTA_SIGNING_KEY_PEM<<CUSTOM_OTA_KEY'
            cat "$RUNNER_TEMP/custom-ota.pem"
            echo 'CUSTOM_OTA_KEY'
          } >> "$GITHUB_ENV"
      - name: Build minimal custom firmware and filesystem
        run: >-
          python tools/build_custom_firmware.py
          --config .pio.nosync/pr-ci.json
          --source-commit "${{ github.sha }}"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.builder_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-platformio.txt') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: python -m pip install --requirement requirements-platformio.txt
      - name: Configure dispatch selection
        if: github.event_name == 'workflow_dispatch'
        env:
          FIRMWARE_REF: ${{ inputs.firmware_ref }}
          FEATURES: ${{ inputs.features }}
          PLUGINS: ${{ inputs.plugins }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          split = lambda value: [item.strip() for item in value.split(",") if item.strip()]
          Path("custom-build.json").write_text(json.dumps({
              "firmware_ref": os.environ["FIRMWARE_REF"],
              "features": split(os.environ["FEATURES"]),
              "plugins": split(os.environ["PLUGINS"]),
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify trusted builder checkout
        if: inputs.combination_hash != ''
        env:
          BUILDER_REF: ${{ inputs.builder_ref }}
          BUILDER_COMMIT: ${{ inputs.builder_commit }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          test -n "$BUILDER_REF"
          test -n "$BUILDER_COMMIT"
          test "$WORKFLOW_COMMIT" = "$BUILDER_COMMIT"
          test "$(git rev-parse HEAD)" = "$BUILDER_COMMIT"
          test "$GITHUB_REF" = "refs/heads/$BUILDER_REF" || test "$GITHUB_REF" = "refs/tags/$BUILDER_REF"
      - name: Validate custom build contracts
        run: |
          python tools/test_plugin_catalog.py
          python tools/test_custom_build_execution.py
          python tools/test_custom_cache_transport.py
          node --test cloudflare/custom-build-worker/test/configurator.test.mjs
          node --test cloudflare/custom-build-worker/test/worker.test.mjs
          node --test cloudflare/custom-build-worker/test/fleet.test.mjs
          node --check docs/custom-build/fleet.js
      - name: Mark custom build as running
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.builder_ref != '' &&
          inputs.builder_commit != '' &&
          inputs.source_commit != '' &&
          inputs.combination_hash != '' &&
          inputs.attempt_id != ''
        env:
          CUSTOM_BUILD_UPLOAD_TOKEN: ${{ secrets.CUSTOM_BUILD_UPLOAD_TOKEN }}
        run: >-
          python tools/update_custom_build_status.py
          --base-url https://openscale-custom-builds.odevstudio.workers.dev
          --combination-hash "${{ inputs.combination_hash }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --state building
      - name: Build isolated custom firmware and filesystem
        id: custom_build
        env:
          HDS_CUSTOM_OTA_SIGNING_KEY_PEM: ${{ secrets.HDS_CUSTOM_OTA_SIGNING_KEY_PEM }}
        run: >-
          python tools/build_custom_firmware.py
          --cache-url https://openscale-custom-builds.odevstudio.workers.dev
          --github-output "$GITHUB_OUTPUT"
          --builder-commit "${{ inputs.builder_commit }}"
          --source-commit "${{ inputs.source_commit }}"
          --expected-hash "${{ inputs.combination_hash }}"
      - name: Upload custom build
        if: steps.custom_build.outputs.cache_hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openscale-custom-${{ steps.custom_build.outputs.combination_hash }}
          path: ${{ steps.custom_build.outputs.output }}/*
          if-no-files-found: error
      - name: Publish custom build
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.builder_ref != '' &&
          inputs.builder_commit != '' &&
          inputs.source_commit != '' &&
          github.workflow_sha == inputs.builder_commit &&
          inputs.combination_hash != '' &&
          inputs.attempt_id != '' &&
          steps.custom_build.outputs.cache_hit != 'true'
        env:
          CUSTOM_BUILD_UPLOAD_TOKEN: ${{ secrets.CUSTOM_BUILD_UPLOAD_TOKEN }}
        run: >-
          python tools/publish_custom_build.py
          --entry "${{ steps.custom_build.outputs.output }}"
          --base-url https://openscale-custom-builds.odevstudio.workers.dev
      - name: Mark custom build as ready
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.builder_ref != '' &&
          inputs.builder_commit != '' &&
          inputs.source_commit != '' &&
          github.workflow_sha == inputs.builder_commit &&
          inputs.combination_hash != '' &&
          inputs.attempt_id != ''
        env:
          CUSTOM_BUILD_UPLOAD_TOKEN: ${{ secrets.CUSTOM_BUILD_UPLOAD_TOKEN }}
        run: >-
          python tools/update_custom_build_status.py
          --base-url https://openscale-custom-builds.odevstudio.workers.dev
          --combination-hash "${{ inputs.combination_hash }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --state ready
      - name: Mark custom build as failed
        if: >-
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.builder_ref != '' &&
          inputs.builder_commit != '' &&
          inputs.source_commit != '' &&
          inputs.combination_hash != '' &&
          inputs.attempt_id != ''
        env:
          CUSTOM_BUILD_UPLOAD_TOKEN: ${{ secrets.CUSTOM_BUILD_UPLOAD_TOKEN }}
        run: >-
          python tools/update_custom_build_status.py
          --base-url https://openscale-custom-builds.odevstudio.workers.dev
          --combination-hash "${{ inputs.combination_hash }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --state failed
          --failure-code build_failed
