name: Deploy custom-build Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-custom-build-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test Worker
        run: node --test cloudflare/custom-build-worker/test/worker.test.mjs
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config cloudflare/custom-build-worker/wrangler.toml
