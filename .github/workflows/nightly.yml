
name: Build firmware

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ai-documentation:
    name: AI documentation contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/test_ai_docs_contract.py
      - run: python tools/test_ble_subscription_contract.py
      - run: python tools/test_mdns_name_contract.py
      - run: python tools/test_ota_reboot_routing_contract.py
      - run: python tools/test_grinder_feature_flag_contract.py
      - run: python tools/test_plugin_ci_contract.py
      - run: python tools/test_low_battery_debounce_contract.py
      - run: python tools/test_energy_stage0_contract.py

  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: python -m pip install --requirement requirements-platformio.txt
      - name: Run host-side tests
        run: pio test -e native

  gzip-assets:
    name: Gzip asset generation contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/test_gzip_web_assets.py

  build:
    name: firmware (esp32s3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          # Key on platformio.ini so a platform/lib pin change busts the cache.
          # A static key froze CI on a stale cached `stable` platform zip (3.3.8)
          # even after the pin should have resolved a newer framework.
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-platformio.txt') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install --requirement requirements-platformio.txt

      - name: Build PlatformIO Project
        run: |
          pio run -e esp32s3
          pio run -e esp32s3-energy-menu
          pio run -e esp32s3 -t buildfs
          pio --version > .pio.nosync/build/esp32s3/dependencies.txt
          pio pkg list -e esp32s3 >> .pio.nosync/build/esp32s3/dependencies.txt

      - name: Assert vendored partition table matches framework
        run: |
          VENDORED=partitions/default_8MB.csv
          UPSTREAM=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/default_8MB.csv
          if ! diff "$VENDORED" "$UPSTREAM" > /dev/null 2>&1; then
            echo "::warning::Vendored $VENDORED differs from the framework-owned default_8MB.csv."
            echo "This may be intentional (we pinned to an older layout) or the framework"
            echo "has changed its partition table. Review the diff and decide whether to"
            echo "update the vendored copy:"
            diff "$VENDORED" "$UPSTREAM" || true
          else
            echo "Vendored partition table matches framework default_8MB.csv."
          fi

      - name: Shorten commit SHA
        id: slugify
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Save firmware file
        uses: actions/upload-artifact@v7
        with:
          name: HDS-snapshot-esp32s3-${{ steps.slugify.outputs.sha }}
          path: |
            .pio.nosync/build/esp32s3/firmware.bin
            .pio.nosync/build/esp32s3/bootloader.bin
            .pio.nosync/build/esp32s3/partitions.bin
            .pio.nosync/build/esp32s3/littlefs.bin

      - name: Save dependency inventory
        uses: actions/upload-artifact@v7
        with:
          name: HDS-dependencies-esp32s3-${{ steps.slugify.outputs.sha }}
          path: .pio.nosync/build/esp32s3/dependencies.txt
