name: Release firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist on main)"
        required: true
      expected_commit:
        description: "Approved full candidate commit SHA"
        required: true
      previous_tag:
        description: "Expected previous published stable tag; empty only for bootstrap"
        default: v3.1.13
      bootstrap_catalog:
        description: "First release only: allow no previous stable catalog"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python tools/release_publication.py candidate --tag "$TAG" --commit "$COMMIT"

  preflight:
    needs: resolve
    uses: ./.github/workflows/nightly.yml
    with:
      commit: ${{ inputs.expected_commit }}

  custom-preflight:
    needs: resolve
    uses: ./.github/workflows/custom-build.yml
    with:
      commit: ${{ inputs.expected_commit }}

  build-and-release:
    needs: [resolve, preflight, custom-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: firmware-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Verify tag and checkout release commit
        env:
          TAG: ${{ github.event.inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(preview|rc)\.[0-9]+)?$ ]]; then
            echo "Error: tag must be a stable, preview.N, or rc.N release"
            exit 1
          fi
          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main
          if ! TAG_COMMIT="$(git rev-parse --verify --end-of-options "refs/tags/$TAG^{commit}")"; then
            echo "Error: tag $TAG does not exist"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Error: tag $TAG is not reachable from main"
            exit 1
          fi
          test "$TAG_COMMIT" = "$EXPECTED_COMMIT"
          git checkout --detach "$TAG_COMMIT"
          if [[ "$TAG" == *-* ]] && ! grep -Fxq '#define HDS_OTA_RELEASE_RECOVERY_VERSION 1' include/pull_ota_version.h; then
            echo "Error: preview tag predates exact-version rollback lookup"
            exit 1
          fi
          for publicKey in keys/ota/hds_ota_manifest_public_key_{1..3}.pem; do
            if [ ! -f "$publicKey" ]; then
              echo "Error: tag $TAG predates the three-key OTA migration"
              exit 1
            fi
          done
          if ! grep -Fq "HDS_FIRMWARE_VERSION" git_rev_macro.py || ! grep -Fq "HDS_FIRMWARE_VERSION" include/config.h; then
            echo "Error: tag $TAG predates the release version injection migration"
            exit 1
          fi
          echo "HDS_FIRMWARE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if [ ! -f requirements-platformio.txt ]; then
            echo "Error: tag $TAG predates the dependency pin migration"
            exit 1
          fi

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          # Key on platformio.ini so a platform/lib pin change busts the cache.
          # A static key froze CI on a stale cached `stable` platform zip (3.3.8)
          # even after the pin should have resolved a newer framework.
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-platformio.txt') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: python -m pip install --requirement requirements-platformio.txt

      - name: Configure OTA manifest public keys
        run: |
          python tools/write_ota_public_key_header.py
          python tools/write_custom_ota_public_key_header.py

      - name: Build PlatformIO Project
        run: |
          set -euo pipefail
          pio run -e esp32s3 || exit 1
          if ! grep -aFq "FW: $HDS_FIRMWARE_VERSION" .pio.nosync/build/esp32s3/firmware.bin; then
            echo "Error: firmware does not contain version $HDS_FIRMWARE_VERSION"
            exit 1
          fi
          pio run -e esp32s3 -t buildfs || exit 1

      - name: Prepare release assets
        env:
          BOOTSTRAP_CATALOG: ${{ inputs.bootstrap_catalog }}
          EXPECTED_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          TAG: ${{ github.event.inputs.tag }}
          HDS_RELEASE_TAG: ${{ github.event.inputs.tag }}
          HDS_RELEASE_REPOSITORY: ${{ github.repository }}
          HDS_RELEASE_MIN_FROM: ${{ vars.HDS_RELEASE_MIN_FROM || '3.0.0' }}
          HDS_OTA_SIGNING_KEY_PEM: ${{ secrets.HDS_OTA_SIGNING_KEY_PEM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          verifyManifestSignature() {
            for publicKey in keys/ota/hds_ota_manifest_public_key_{1..3}.pem; do
              if openssl dgst -sha256 -verify "$publicKey" -signature "$2" "$1"; then
                return 0
              fi
            done
            return 1
          }
          if [ -z "${HDS_OTA_SIGNING_KEY_PEM:-}" ]; then
            echo "Error: HDS_OTA_SIGNING_KEY_PEM secret is required"
            exit 1
          fi
          mkdir -p release-files legacy-files
          pio --version > release-files/dependencies.txt
          pio pkg list -e esp32s3 >> release-files/dependencies.txt
          cp ".pio.nosync/build/esp32s3/firmware.bin" release-files/
          cp ".pio.nosync/build/esp32s3/littlefs.bin" release-files/
          for file in firmware.bin bootloader.bin partitions.bin littlefs.bin; do
            if [ ! -f ".pio.nosync/build/esp32s3/$file" ]; then
              echo "Error: File .pio.nosync/build/esp32s3/$file not found"
              exit 1
            fi
            cp ".pio.nosync/build/esp32s3/$file" legacy-files/
          done
          PREVIOUS_MANIFEST_ARGS=()
          PREVIOUS_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ "$PREVIOUS_TAG" != "$EXPECTED_PREVIOUS_TAG" ]; then
            echo "Error: previous stable release differs from the approved baseline"
            exit 1
          fi
          if [ -n "$PREVIOUS_TAG" ]; then
            mkdir -p previous-release
            for attempt in 1 2 3; do
              rm -f previous-release/manifest.json previous-release/manifest.sig
              if gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir previous-release &&
                 gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern manifest.sig --dir previous-release &&
                 [ -s previous-release/manifest.json ] && [ -s previous-release/manifest.sig ]; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Error: previous OTA catalog download failed or is incomplete ($PREVIOUS_TAG)"
                exit 1
              fi
              echo "Retrying previous OTA catalog download ($attempt/3)"
              sleep 5
            done
            verifyManifestSignature previous-release/manifest.json previous-release/manifest.sig
            PREVIOUS_MANIFEST_ARGS=(--previous-manifest previous-release/manifest.json)
          elif [ "${BOOTSTRAP_CATALOG:-false}" != "true" ]; then
            echo "Error: no previous stable release; first release requires explicit bootstrap_catalog"
            exit 1
          fi
          python tools/generate_release_manifest.py --tag "$TAG" --output-dir release-files --catalog --catalog-min-version v3.1.13 "${PREVIOUS_MANIFEST_ARGS[@]}"
          if [ ! -f release-files/manifest.sig ]; then
            echo "Error: manifest.sig not generated"
            exit 1
          fi
          verifyManifestSignature release-files/manifest.json release-files/manifest.sig
          cd legacy-files
          zip "../HDS_FW_${TAG}.zip" ./* || exit 1
          cd ..
      - name: Create draft release
        env:
          TAG: ${{ github.event.inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_FLAGS=(--latest=false)
          if [[ "$TAG" == *-* ]]; then
            RELEASE_FLAGS=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            "${RELEASE_FLAGS[@]}" \
            --title="$TAG" \
            --generate-notes \
            "HDS_FW_${TAG}.zip" \
            release-files/firmware.bin \
            release-files/littlefs.bin \
            release-files/dependencies.txt
          gh release upload "$TAG" release-files/manifest.sig
          gh release upload "$TAG" release-files/manifest.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release
          python tools/verify_release_assets.py --tag "$TAG" --download-dir downloaded-release
      - name: Sign release evidence
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
          HDS_OTA_SIGNING_KEY_PEM: ${{ secrets.HDS_OTA_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          python tools/release_publication.py evidence --tag "$TAG" --commit "$COMMIT" --previous-tag "$PREVIOUS_TAG"
      - name: Upload and verify evidence and draft bytes
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" downloaded-release/release-evidence.json downloaded-release/release-evidence.sig
          python tools/release_publication.py verify-draft --tag "$TAG" --commit "$COMMIT"
